name: Publish initial public miPet release
on:
  push:
    branches: [main]
    paths: ['bootstrap/miPet-0.1.0-2.ipa', '.github/workflows/initial-mipet-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zynthec-apps-source
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify IPA indexing and reject embedded keys
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Create release and publish public IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view mipet-v0.1.0-2 >/dev/null 2>&1; then
            gh release create mipet-v0.1.0-2 --target main --title 'miPet 0.1.0 (2)' --notes-file releases/mipet-0.1.0-2.md bootstrap/miPet-0.1.0-2.ipa
          else
            gh release upload mipet-v0.1.0-2 bootstrap/miPet-0.1.0-2.ipa --clobber
          fi
      - name: Refresh original SideInstaller and verify public source
        run: |
          python3 scripts/update_sideinstaller_source.py
          python3 scripts/check_source.py --remote
      - name: Commit source update
        run: |
          if git diff --quiet -- source.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json
          git commit -m 'Refresh source after initial release [skip ci]'
          git push
