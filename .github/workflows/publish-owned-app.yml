name: Index own app release
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: zynthec-apps-source
  cancel-in-progress: false
jobs:
  index:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_owned_app.py --event "$GITHUB_EVENT_PATH"
      - name: Commit source update
        run: |
          if git diff --quiet -- source.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json
          git commit -m 'Index published app release [skip ci]'
          git push
